name: Teacher deal freshness

on:
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * *'

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check verification age, expirations, and official links
        run: node scripts/check-deal-freshness.mjs
        env:
          STALE_DAYS: '45'
          LINK_TIMEOUT_MS: '12000'

      - name: Upload full freshness report
        uses: actions/upload-artifact@v4
        with:
          name: teacher-deal-freshness
          path: freshness-report.json
          retention-days: 14

      - name: Open or update review issue when needed
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('freshness-report.json', 'utf8'));
            const title = 'Automated deal freshness report';
            const { owner, repo } = context.repo;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            const issue = existing.find(item => !item.pull_request && item.title === title);

            if (!report.actionableCount) {
              if (issue) {
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number, state: 'closed',
                  body: `Daily freshness check passed on ${report.checkedAt}. No active listing currently crosses the configured review thresholds.`
                });
              }
              core.info('No deal freshness problems detected.');
              return;
            }

            const lines = report.actionable.map(row =>
              `- [ ] **${row.organization} — ${row.title}**\n  - ${row.problems.join('\n  - ')}\n  - ${row.url}`
            );
            const body = [
              'This issue is maintained automatically by the daily Teacher Treasure freshness check.',
              '',
              `**Checked:** ${report.checkedAt}`,
              `**Needs review:** ${report.actionableCount} of ${report.total}`,
              `**Stale threshold:** ${report.staleAfterDays} days`,
              '',
              ...lines,
              '',
              'A successful HTTP response only proves the official page is reachable; manually confirm the educator offer terms before changing `lastVerified`.'
            ].join('\n');

            if (issue) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
